<script>
const UNITS = {
  length: {
    label: 'Length',
    units: { mm: 0.001, cm: 0.01, m: 1, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
  },
  weight: {
    label: 'Weight',
    units: { mg: 0.001, g: 1, kg: 1000, oz: 28.3495, lb: 453.592, st: 6350.29 },
  },
  temperature: {
    label: 'Temperature',
    units: { C: 'C', F: 'F', K: 'K' },
  },
  volume: {
    label: 'Volume',
    units: { ml: 0.001, l: 1, tsp: 0.00492892, tbsp: 0.0147868, floz: 0.0295735, cup: 0.24, pt: 0.473176, qt: 0.946353, gal: 3.78541 },
  },
  speed: {
    label: 'Speed',
    units: { 'm/s': 1, 'km/h': 0.277778, mph: 0.44704, knot: 0.514444, 'ft/s': 0.3048 },
  },
};

const categorySelect = document.getElementById('category-select');
const fromUnit = document.getElementById('from-unit');
const toUnit = document.getElementById('to-unit');
const fromValue = document.getElementById('from-value');
const toValue = document.getElementById('to-value');

Object.keys(UNITS).forEach(key => {
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = UNITS[key].label;
  categorySelect.appendChild(opt);
});

function populateUnitSelects() {
  const cat = UNITS[categorySelect.value];
  const keys = Object.keys(cat.units);
  [fromUnit, toUnit].forEach(select => {
    select.innerHTML = '';
    keys.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = k;
      select.appendChild(opt);
    });
  });
  fromUnit.value = keys[0];
  toUnit.value = keys[1] || keys[0];
}

function tempToCelsius(v, unit) {
  if (unit === 'C') return v;
  if (unit === 'F') return (v - 32) * 5 / 9;
  if (unit === 'K') return v - 273.15;
}
function celsiusToTemp(c, unit) {
  if (unit === 'C') return c;
  if (unit === 'F') return c * 9 / 5 + 32;
  if (unit === 'K') return c + 273.15;
}

function formatNumber(n) {
  if (!isFinite(n)) return '';
  const rounded = Math.round(n * 1e6) / 1e6;
  return String(rounded);
}

function convert() {
  const cat = categorySelect.value;
  const raw = parseFloat(fromValue.value);
  if (isNaN(raw)) { toValue.value = ''; return; }

  if (cat === 'temperature') {
    const celsius = tempToCelsius(raw, fromUnit.value);
    toValue.value = formatNumber(celsiusToTemp(celsius, toUnit.value));
    return;
  }

  const factors = UNITS[cat].units;
  const base = raw * factors[fromUnit.value];
  toValue.value = formatNumber(base / factors[toUnit.value]);
}

categorySelect.addEventListener('change', () => { populateUnitSelects(); convert(); });
fromUnit.addEventListener('change', convert);
toUnit.addEventListener('change', convert);
fromValue.addEventListener('input', convert);

document.getElementById('swap-btn').addEventListener('click', () => {
  const tmp = fromUnit.value;
  fromUnit.value = toUnit.value;
  toUnit.value = tmp;
  const val = parseFloat(toValue.value);
  fromValue.value = isNaN(val) ? fromValue.value : val;
  convert();
});

populateUnitSelects();
convert();
</script>
